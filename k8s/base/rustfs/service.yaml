apiVersion: v1
kind: Service
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: durable-locks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
    - name: console
      port: 80
      targetPort: console
      protocol: TCP
