apiVersion: v1
kind: Service
metadata:
  name: celld
  labels:
    app.kubernetes.io/name: celld
    app.kubernetes.io/component: worker-runtime
    app.kubernetes.io/part-of: durable-locks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: celld
  ports:
    - name: worker
      port: 8080
      targetPort: worker
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: celld-internal
  labels:
    app.kubernetes.io/name: celld
    app.kubernetes.io/component: worker-runtime
    app.kubernetes.io/part-of: durable-locks
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: celld
  ports:
    - name: internal
      port: 8081
      targetPort: internal
      protocol: TCP
