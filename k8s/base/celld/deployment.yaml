apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
  labels:
    app.kubernetes.io/name: celld
    app.kubernetes.io/component: worker-runtime
    app.kubernetes.io/part-of: durable-locks
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld
        app.kubernetes.io/component: worker-runtime
        app.kubernetes.io/part-of: durable-locks
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: celld
          image: ghcr.io/denoland/celld:0.2.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: AWS_REGION
              value: us-east-1
            - name: CELLD_BUCKET
              value: s3://durable-locks
            - name: S3_ENDPOINT
              value: http://s3.durable-locks.svc.cluster.local:9000
            - name: CELLD_ADDR
              value: 0.0.0.0:8080
            - name: CELLD_INTERNAL_ADDR
              value: 0.0.0.0:8081
            - name: CELLD_ADVERTISE
              value: api-internal.durable-locks.svc.cluster.local:8081
            - name: CELLD_WATCH
              value: /var/lib/celld/state
          ports:
            - name: worker
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: worker
            failureThreshold: 45
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: worker
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: worker
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/celld
      volumes:
        - name: state
          emptyDir: {}
