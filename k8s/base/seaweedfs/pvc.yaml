apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: durable-locks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
