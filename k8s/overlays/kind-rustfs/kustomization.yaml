apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: durable-locks
resources:
  - ../../base
  - namespace.yaml
secretGenerator:
  - name: s3-credentials
    literals:
      - AWS_ACCESS_KEY_ID=durable-locks
      - AWS_SECRET_ACCESS_KEY=durable-locks-secret
    options:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/component: object-storage
        app.kubernetes.io/part-of: durable-locks
patches:
  - target:
      kind: Deployment
      name: rustfs
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: kind-worker
  - target:
      kind: PersistentVolumeClaim
      name: rustfs-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: standard
